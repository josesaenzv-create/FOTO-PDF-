<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escáner de Expedientes - CREDIBAN</title>
    
    <!-- LIBRERÍAS PURAS (Sin bloqueos de operadoras) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #f8fafc;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
            100% { transform: translateY(0px); }
        }
        .logo-hover:hover svg { animation: float 2s ease-in-out infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen text-slate-800">

    <!-- PANTALLA DE CARGA AISLADA -->
    <div id="loader-container" style="display: flex; height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: fixed; width: 100%; top: 0; left: 0; background-color: #f8fafc; z-index: 9999;">
        <div style="width: 60px; height: 60px; border: 6px solid #e2e8f0; border-top-color: #59B447; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <h2 style="margin-top: 24px; color: #334155; font-size: 20px; font-weight: bold;">Iniciando Sistema...</h2>
        <p style="color: #64748b; font-size: 14px; margin-top: 8px;">Conectando con CREDIBAN</p>
        <!-- Detector de errores visible -->
        <div id="error-log" style="color: #ef4444; margin-top: 20px; font-size: 12px; font-weight: bold; max-width: 80%;"></div>
    </div>

    <!-- AQUÍ SE RENDERIZA LA APLICACIÓN -->
    <div id="root"></div>

    <script>
        // Si hay algún error en el navegador, lo mostramos en pantalla para saber qué pasa
        window.addEventListener('error', function(e) {
            const log = document.getElementById('error-log');
            if(log) log.innerHTML += "Falla de red detectada. Recarga la página.<br>";
        });
    </script>

    <script type="text/babel">
        function EscanerApp() {
            // ==========================================
            // EFECTO DE ARRANQUE (Oculta la pantalla de carga al iniciar)
            // ==========================================
            React.useEffect(() => {
                const loader = document.getElementById('loader-container');
                if (loader) loader.style.display = 'none';
            }, []);

            // ==========================================
            // ESTADOS DE LA APLICACIÓN
            // ==========================================
            const [nombre, setNombre] = React.useState('');
            const [apellido, setApellido] = React.useState('');
            const [dni, setDni] = React.useState('');
            
            const [step, setStep] = React.useState(1);
            const [pages, setPages] = React.useState([]);
            
            const [activeSlot, setActiveSlot] = React.useState(null); 
            const [currentFile, setCurrentFile] = React.useState(null);
            const [currentGps, setCurrentGps] = React.useState(null);
            const [rotation, setRotation] = React.useState(0);
            
            const [preview, setPreview] = React.useState(null);
            const [isGettingGps, setIsGettingGps] = React.useState(false);
            const [isProcessingImage, setIsProcessingImage] = React.useState(false);
            const [isGenerating, setIsGenerating] = React.useState(false);
            
            const [gpsGlobalStatus, setGpsGlobalStatus] = React.useState('buscando');
            
            const cameraInputRef = React.useRef(null);
            const galleryInputRef = React.useRef(null);

            // ==========================================
            // MONITOR GPS
            // ==========================================
            React.useEffect(() => {
                let watchId;
                if ("geolocation" in navigator) {
                    watchId = navigator.geolocation.watchPosition(
                        (position) => setGpsGlobalStatus('listo'),
                        (error) => setGpsGlobalStatus('denegado'),
                        { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
                    );
                } else {
                    setGpsGlobalStatus('denegado');
                }
                return () => {
                    if (watchId) navigator.geolocation.clearWatch(watchId);
                };
            }, []);

            // ==========================================
            // FUNCIONES LÓGICAS INTACTAS
            // ==========================================
            const iniciarEscaner = (e) => {
                e.preventDefault();
                if (!nombre || !apellido || !dni) {
                    alert("Por favor completa los datos del cliente.");
                    return;
                }
                if (pages.length === 0) addPage(1);
                setStep(2);
            };

            const addPage = (layout) => {
                setPages([...pages, { id: Date.now(), layout: layout, images: Array(layout).fill(null) }]);
            };

            const removePage = (pageIndex) => {
                if(confirm("¿Seguro que deseas eliminar esta hoja completa del documento?")){
                    const newPages = [...pages];
                    newPages.splice(pageIndex, 1);
                    setPages(newPages);
                }
            };

            const openCamera = (pageIdx, imgIdx) => {
                setActiveSlot({ pageIndex: pageIdx, photoIndex: imgIdx, source: 'camera' });
                if (cameraInputRef.current) cameraInputRef.current.click();
            };

            const openGallery = (pageIdx, imgIdx) => {
                setActiveSlot({ pageIndex: pageIdx, photoIndex: imgIdx, source: 'gallery' });
                if (galleryInputRef.current) galleryInputRef.current.click();
            };

            const getGPS = () => {
                return new Promise((resolve, reject) => {
                    if (!navigator.geolocation) return reject("Navegador sin GPS");
                    navigator.geolocation.getCurrentPosition(
                        pos => resolve(pos),
                        err => reject(err),
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                });
            };

            const handleFileSelected = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setCurrentFile(file);
                setRotation(0);
                setPreview(null);
                setStep(3); 

                if (activeSlot && activeSlot.source === 'camera') {
                    setIsGettingGps(true);
                    try {
                        const pos = await getGPS();
                        setCurrentGps({
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            alt: pos.coords.altitude || null,
                            acc: pos.coords.accuracy,
                            time: new Date().toLocaleString('es-PE', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' })
                        });
                    } catch (err) {
                        setCurrentGps({
                            error: "GPS No Disponible",
                            time: new Date().toLocaleString('es-PE', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit' })
                        });
                    }
                    setIsGettingGps(false);
                } else {
                    setCurrentGps(null);
                }
                e.target.value = ''; 
            };

            const generatePreview = (file, source, angle, gps) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            
                            let targetWidth = img.width;
                            let targetHeight = img.height;
                            const MAX_DIM = 2500;
                            if (targetWidth > MAX_DIM || targetHeight > MAX_DIM) {
                                const ratio = Math.min(MAX_DIM / targetWidth, MAX_DIM / targetHeight);
                                targetWidth *= ratio;
                                targetHeight *= ratio;
                            }

                            if (angle % 180 !== 0) {
                                canvas.width = targetHeight;
                                canvas.height = targetWidth;
                            } else {
                                canvas.width = targetWidth;
                                canvas.height = targetHeight;
                            }

                            ctx.translate(canvas.width/2, canvas.height/2);
                            ctx.rotate((angle * Math.PI) / 180);
                            ctx.drawImage(img, -targetWidth/2, -targetHeight/2, targetWidth, targetHeight);
                            ctx.setTransform(1, 0, 0, 1, 0, 0);

                            if (source === 'camera' && gps) {
                                const fontSize = Math.max(24, canvas.width * 0.025);
                                ctx.font = `bold ${fontSize}px Arial`;
                                ctx.textAlign = "right";
                                ctx.textBaseline = "bottom";
                                
                                const margin = fontSize;
                                let startY = canvas.height - margin;
                                
                                const lines = [
                                    `CREDIBAN PERÚ - Trabajo de Campo`,
                                    gps.error ? `${gps.time} (${gps.error})` : `${gps.time}`,
                                ];
                                
                                if (!gps.error) {
                                    lines.push(`Lat: ${gps.lat.toFixed(6)}  Lng: ${gps.lng.toFixed(6)}`);
                                    if (gps.alt) lines.push(`Altitud: ${gps.alt.toFixed(1)} msnm`);
                                }

                                lines.reverse().forEach(line => {
                                    ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                                    ctx.lineWidth = fontSize * 0.2;
                                    ctx.strokeText(line, canvas.width - margin, startY);
                                    ctx.fillStyle = '#facc15'; 
                                    ctx.fillText(line, canvas.width - margin, startY);
                                    startY -= (fontSize * 1.2);
                                });
                            }
                            resolve(canvas.toDataURL('image/jpeg', 0.85));
                        };
                        img.src = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            React.useEffect(() => {
                if (step === 3 && currentFile && !isGettingGps) {
                    setIsProcessingImage(true);
                    generatePreview(currentFile, activeSlot.source, rotation, currentGps)
                        .then(dataUrl => {
                            setPreview(dataUrl);
                            setIsProcessingImage(false);
                        });
                }
            }, [currentFile, rotation, currentGps, isGettingGps, step]);

            const aceptarHoja = () => {
                if (activeSlot !== null && preview) {
                    const newPages = [...pages];
                    newPages[activeSlot.pageIndex].images[activeSlot.photoIndex] = preview;
                    setPages(newPages);
                }
                setPreview(null);
                setCurrentFile(null);
                setActiveSlot(null);
                setStep(2);
            };

            const descartarHoja = () => {
                setPreview(null);
                setCurrentFile(null);
                setActiveSlot(null);
                setStep(2);
            };

            const removePhoto = (pageIdx, imgIdx) => {
                const newPages = [...pages];
                newPages[pageIdx].images[imgIdx] = null;
                setPages(newPages);
            };

            const generarYEnviarPDF = async () => {
                const hasPhotos = pages.some(p => p.images.some(img => img !== null));
                if (!hasPhotos) {
                    alert("El documento está vacío. Añade fotos primero.");
                    return;
                }
                setIsGenerating(true);
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF('p', 'mm', 'a4');
                    const pageWidth = doc.internal.pageSize.getWidth();
                    const pageHeight = doc.internal.pageSize.getHeight();
                    const margin = 10;
                    
                    let pagesAdded = 0;

                    for (let p = 0; p < pages.length; p++) {
                        const pageData = pages[p];
                        if (pageData.images.every(img => img === null)) continue;
                        
                        if (pagesAdded > 0) doc.addPage();
                        pagesAdded++;

                        for (let i = 0; i < pageData.images.length; i++) {
                            const imgData = pageData.images[i];
                            if (!imgData) continue; 

                            const imgProps = doc.getImageProperties(imgData);
                            let boxX, boxY, boxW, boxH;

                            if (pageData.layout === 1) {
                                boxX = margin;
                                boxY = margin;
                                boxW = pageWidth - (margin * 2);
                                boxH = pageHeight - (margin * 2);
                            } else if (pageData.layout === 2) {
                                boxW = pageWidth - (margin * 2);
                                boxH = (pageHeight - (margin * 3)) / 2;
                                boxX = margin;
                                boxY = margin + (i * (boxH + margin));
                            } else if (pageData.layout === 4) {
                                boxW = (pageWidth - (margin * 3)) / 2;
                                boxH = (pageHeight - (margin * 3)) / 2;
                                const col = i % 2;
                                const row = Math.floor(i / 2);
                                boxX = margin + (col * (boxW + margin));
                                boxY = margin + (row * (boxH + margin));
                            }

                            let renderW = boxW;
                            let renderH = (imgProps.height * renderW) / imgProps.width;
                            
                            if (renderH > boxH) {
                                renderH = boxH;
                                renderW = (imgProps.width * renderH) / imgProps.height;
                            }
                            
                            const xOffset = boxX + (boxW - renderW) / 2;
                            const yOffset = boxY + (boxH - renderH) / 2;

                            doc.addImage(imgData, 'JPEG', xOffset, yOffset, renderW, renderH, undefined, 'FAST');
                            doc.setDrawColor(200);
                            doc.rect(boxX, boxY, boxW, boxH);
                        }
                    }

                    const pdfBlob = doc.output('blob');
                    const hoy = new Date();
                    const fileName = `${String(hoy.getDate()).padStart(2, '0')}-${String(hoy.getMonth() + 1).padStart(2, '0')}_${nombre.trim().replace(/\s+/g, '')}_${apellido.trim().replace(/\s+/g, '')}-${dni.trim()}.pdf`;
                    
                    const file = new File([pdfBlob], fileName, { type: 'application/pdf' });
                    const txtMsg = `Estimado cliente, adjunto su expediente digitalizado.\nTitular: ${nombre} ${apellido}\nDNI: ${dni}`;

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: `Expediente CREDIBAN`, text: txtMsg });
                    } else {
                        const url = URL.createObjectURL(pdfBlob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        a.click();
                        const msg = encodeURIComponent(`${txtMsg}\n(Favor de adjuntar el PDF descargado manualmente).`);
                        window.open(`https://wa.me/?text=${msg}`, '_blank');
                    }
                } catch (error) {
                    console.error("Error:", error);
                    alert("Error al generar PDF.");
                } finally {
                    setIsGenerating(false);
                }
            };

            // ==========================================
            // COMPONENTE HEADER CON INDICADOR GPS
            // ==========================================
            const Header = () => (
                <header className="bg-white shadow-sm border-b border-slate-200 py-3 px-4 w-full z-50">
                    <div className="max-w-7xl mx-auto flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-10 md:w-12 h-auto flex-shrink-0 logo-hover">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" className="w-full h-full">
                                    <g fill="#59B447">
                                        <rect x="90" y="8" width="24" height="13" rx="6.5" className="animate-pulse"/>
                                        <rect x="71" y="31" width="61" height="13" rx="6.5" style={{animationDelay: "100ms"}} className="animate-pulse"/>
                                        <rect x="50" y="55" width="74" height="13" rx="6.5" style={{animationDelay: "200ms"}} className="animate-pulse"/>
                                        <rect x="31" y="79" width="75" height="13" rx="6.5" style={{animationDelay: "300ms"}} className="animate-pulse"/>
                                        <rect x="24" y="103" width="63" height="13" rx="6.5" style={{animationDelay: "400ms"}} className="animate-pulse"/>
                                        <rect x="37" y="128" width="24" height="13" rx="6.5" style={{animationDelay: "500ms"}} className="animate-pulse"/>
                                        <path d="M143 55 C141 78 130 95 111 107 C96 117 81 122 72 134 C62 147 63 166 70 181 C76 195 87 208 97 216 C107 201 118 189 131 177 C144 166 157 156 164 141 C173 123 173 104 168 89 C164 74 156 62 143 55 Z"/>
                                    </g>
                                </svg>
                            </div>
                            <div className="flex flex-col justify-center text-left">
                                <span className="text-[#59B447] font-bold text-xl md:text-3xl leading-none tracking-widest drop-shadow-sm" style={{ fontFamily: "Georgia, 'Times New Roman', serif" }}>CREDIBAN</span>
                                <span className="text-[#59B447] font-bold text-[8px] md:text-[11px] leading-tight tracking-wide mt-1 uppercase" style={{ fontFamily: "Arial, Helvetica, sans-serif" }}>empieza a construir tus sueños</span>
                            </div>
                        </div>

                        <div className={`flex items-center gap-1.5 px-3 py-1.5 md:px-4 md:py-2 rounded-full text-[10px] md:text-xs font-bold border transition-colors shadow-sm ${
                            gpsGlobalStatus === 'listo' ? 'bg-green-50 text-green-700 border-green-200' :
                            gpsGlobalStatus === 'buscando' ? 'bg-yellow-50 text-yellow-700 border-yellow-200' :
                            'bg-red-50 text-red-600 border-red-200'
                        }`}>
                            {gpsGlobalStatus === 'listo' && <><i className="fa-solid fa-location-crosshairs text-sm md:text-base"></i><span className="hidden sm:inline">GPS Activo</span><span className="sm:hidden">Activo</span></>}
                            {gpsGlobalStatus === 'buscando' && <><i className="fa-solid fa-satellite-dish animate-pulse text-sm md:text-base"></i><span className="hidden sm:inline">Buscando...</span><span className="sm:hidden">Buscando</span></>}
                            {gpsGlobalStatus === 'denegado' && <><i className="fa-solid fa-triangle-exclamation text-sm md:text-base"></i><span className="hidden sm:inline">Bloqueado</span><span className="sm:hidden">Bloqueado</span></>}
                        </div>
                    </div>
                </header>
            );

            // ==========================================
            // PANTALLA 1: CONFIGURACIÓN
            // ==========================================
            if (step === 1) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col">
                        <Header />
                        <main className="flex-1 w-full max-w-7xl mx-auto p-6 md:p-12 flex items-center justify-center">
                            <div className="glass-card p-8 md:p-12 rounded-3xl w-full max-w-3xl shadow-xl border border-slate-200">
                                <div className="w-16 h-16 bg-green-50 text-[#59B447] rounded-full flex items-center justify-center text-3xl mb-6 shadow-inner mx-auto md:mx-0">
                                    <i className="fa-solid fa-folder-open"></i>
                                </div>
                                <h2 className="text-2xl md:text-3xl font-bold text-slate-800 mb-8 text-center md:text-left">Apertura de Expediente</h2>
                                
                                <form onSubmit={iniciarEscaner} className="space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-500 uppercase mb-2">Nombre del Cliente</label>
                                            <input type="text" required value={nombre} onChange={e => setNombre(e.target.value.toUpperCase())} className="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-[#59B447] focus:border-[#59B447] outline-none transition-all shadow-sm font-semibold text-slate-700 bg-white" placeholder="Ej: JUAN" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-500 uppercase mb-2">Apellido del Cliente</label>
                                            <input type="text" required value={apellido} onChange={e => setApellido(e.target.value.toUpperCase())} className="w-full p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-[#59B447] focus:border-[#59B447] outline-none transition-all shadow-sm font-semibold text-slate-700 bg-white" placeholder="Ej: PEREZ" />
                                        </div>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm font-bold text-slate-500 uppercase mb-2">Documento de Identidad (DNI)</label>
                                        <div className="relative">
                                            <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                                <i className="fa-regular fa-id-card text-xl"></i>
                                            </div>
                                            <input type="tel" maxLength="8" required value={dni} onChange={e => setDni(e.target.value.replace(/\D/g, ''))} className="w-full pl-12 p-4 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-[#59B447] focus:border-[#59B447] outline-none transition-all shadow-sm font-bold tracking-widest text-xl text-slate-700 bg-white" placeholder="12345678" />
                                        </div>
                                    </div>

                                    <div className="pt-4">
                                        <button type="submit" className="w-full bg-gradient-to-r from-[#59B447] to-[#4a973a] hover:from-[#4a973a] hover:to-[#3d7a2f] text-white font-bold py-5 rounded-2xl shadow-lg shadow-green-500/30 transition-all active:scale-95 flex items-center justify-center gap-3 text-xl">
                                            Empezar a Escanear <i className="fa-solid fa-arrow-right"></i>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </main>
                    </div>
                );
            }

            // ==========================================
            // PANTALLA 3: PREVISUALIZACIÓN Y CÁMARA
            // ==========================================
            if (step === 3) {
                return (
                    <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-between p-4 md:p-8 relative">
                        <div className="w-full text-center py-6 z-10 max-w-3xl">
                            <h2 className="text-white text-2xl font-bold">Ajuste de Imagen</h2>
                            <p className="text-green-400 text-base font-medium mt-1">Hoja {activeSlot ? activeSlot.pageIndex + 1 : 0} (Posición {activeSlot ? activeSlot.photoIndex + 1 : 0})</p>
                        </div>
                        
                        <div className="flex-1 w-full max-w-4xl bg-black/50 rounded-3xl overflow-hidden flex items-center justify-center my-4 border border-slate-700 relative shadow-2xl p-4">
                            {isGettingGps ? (
                                <div className="text-white text-center animate-pulse flex flex-col items-center">
                                    <div className="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center text-4xl mb-4"><i className="fa-solid fa-satellite-dish text-[#59B447]"></i></div>
                                    <span className="font-semibold text-lg">Obteniendo coordenadas GPS...</span>
                                </div>
                            ) : isProcessingImage ? (
                                <div className="text-white text-center animate-pulse flex flex-col items-center">
                                    <div className="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center text-4xl mb-4"><i className="fa-solid fa-spinner fa-spin text-[#59B447]"></i></div>
                                    <span className="font-semibold text-lg">Procesando imagen...</span>
                                </div>
                            ) : preview ? (
                                <img src={preview} alt="Previsualización" className="max-w-full max-h-[70vh] object-contain rounded-xl shadow-lg border border-slate-700" />
                            ) : null}
                        </div>

                        <div className="w-full max-w-3xl grid grid-cols-3 gap-4 pb-8 z-10 px-2 mt-4">
                            <button onClick={descartarHoja} className="bg-slate-800 hover:bg-slate-700 text-white text-sm md:text-base font-bold py-5 rounded-2xl border border-slate-700 transition-all flex flex-col items-center justify-center active:scale-95 shadow-lg">
                                <i className="fa-solid fa-xmark text-2xl mb-2 text-red-400"></i> Rechazar
                            </button>
                            <button onClick={() => setRotation(r => (r + 90) % 360)} disabled={!preview || isProcessingImage} className="bg-blue-600 hover:bg-blue-500 text-white text-sm md:text-base font-bold py-5 rounded-2xl transition-all flex flex-col items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed active:scale-95 shadow-lg shadow-blue-500/20">
                                <i className="fa-solid fa-rotate-right text-2xl mb-2"></i> Girar
                            </button>
                            <button onClick={aceptarHoja} disabled={!preview || isProcessingImage} className="bg-gradient-to-r from-[#59B447] to-[#4a973a] text-white text-sm md:text-base font-bold py-5 rounded-2xl transition-all shadow-lg shadow-green-500/30 flex flex-col items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed active:scale-95">
                                <i className="fa-solid fa-check text-2xl mb-2"></i> Aprobar
                            </button>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // PANTALLA 2: CONSTRUCTOR DEL EXPEDIENTE
            // ==========================================
            return (
                <div className="min-h-screen bg-slate-50 flex flex-col relative pb-24 md:pb-0">
                    <input type="file" accept="image/*" capture="environment" className="hidden" ref={cameraInputRef} onChange={handleFileSelected} />
                    <input type="file" accept="image/*" className="hidden" ref={galleryInputRef} onChange={handleFileSelected} />

                    <Header />

                    <main className="flex-1 w-full max-w-7xl mx-auto p-4 md:p-8">
                        <div className="flex flex-col md:flex-row gap-8 items-start">
                            
                            {/* COLUMNA IZQUIERDA: Hojas del PDF */}
                            <div className="w-full md:w-2/3 flex flex-col gap-6">
                                <h3 className="text-xl font-bold text-slate-800 mb-2 border-b border-slate-200 pb-2">Contenido del Expediente</h3>
                                
                                {pages.length === 0 ? (
                                    <div className="glass-card rounded-3xl p-10 text-center border-dashed border-2 border-slate-300">
                                        <i className="fa-regular fa-folder-open text-5xl text-slate-300 mb-4 block"></i>
                                        <p className="text-slate-500 font-medium text-lg">El expediente está vacío.</p>
                                        <p className="text-slate-400 text-sm">Añade hojas utilizando el panel derecho.</p>
                                    </div>
                                ) : (
                                    pages.map((page, pIdx) => (
                                        <div key={page.id} className="bg-white border border-slate-200 rounded-3xl shadow-sm overflow-hidden relative group transition-all hover:shadow-md">
                                            <div className="bg-slate-50/80 px-5 py-4 border-b border-slate-100 flex justify-between items-center backdrop-blur-sm">
                                                <span className="font-bold text-slate-700 text-base flex items-center gap-2">
                                                    <i className="fa-regular fa-file-pdf text-[#59B447]"></i> Hoja {pIdx + 1} 
                                                    <span className="bg-white px-2 py-0.5 rounded-md text-xs text-slate-500 border border-slate-200 shadow-sm">{page.layout} fotos</span>
                                                </span>
                                                <button onClick={() => removePage(pIdx)} className="text-red-500 hover:text-white hover:bg-red-500 hover:border-red-500 text-xs font-bold bg-white px-3 py-1.5 rounded-lg border border-red-200 shadow-sm transition-all">
                                                    <i className="fa-solid fa-trash-can mr-1"></i> Borrar
                                                </button>
                                            </div>
                                            
                                            <div className={`p-5 grid gap-4 ${page.layout === 1 ? 'grid-cols-1 md:w-2/3 mx-auto aspect-[3/4]' : page.layout === 2 ? 'grid-cols-1 md:w-3/4 mx-auto' : 'grid-cols-2'}`}>
                                                {page.images.map((imgUrl, iIdx) => (
                                                    <div key={iIdx} className={`relative rounded-2xl border-2 overflow-hidden bg-slate-50 flex flex-col items-center justify-center transition-all ${page.layout !== 1 ? 'aspect-[4/3]' : 'h-full'} ${imgUrl ? 'border-[#59B447] shadow-sm' : 'border-dashed border-slate-300 hover:border-blue-400'}`}>
                                                        {imgUrl ? (
                                                            <>
                                                                <img src={imgUrl} className="w-full h-full object-cover" alt={`H${pIdx+1}-F${iIdx+1}`} />
                                                                <button onClick={() => removePhoto(pIdx, iIdx)} className="absolute top-2 right-2 bg-red-500 text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg active:scale-95 z-10 text-sm transition-transform hover:scale-110">
                                                                    <i className="fa-solid fa-xmark"></i>
                                                                </button>
                                                            </>
                                                        ) : (
                                                            <div className="flex flex-col w-full h-full p-4 gap-4 justify-center items-center">
                                                                <span className="text-xs text-slate-400 font-bold uppercase tracking-wider bg-white px-3 py-1 rounded-full shadow-sm">Foto {iIdx + 1}</span>
                                                                <div className="flex flex-col sm:flex-row w-full gap-3 px-2">
                                                                    <button onClick={() => openCamera(pIdx, iIdx)} className="flex-1 bg-white text-blue-600 hover:bg-blue-50 border border-blue-100 rounded-xl py-3 flex flex-col items-center justify-center transition-all shadow-sm active:scale-95">
                                                                        <i className="fa-solid fa-camera text-2xl mb-1"></i>
                                                                        <span className="text-[11px] font-bold uppercase">Cámara</span>
                                                                    </button>
                                                                    <button onClick={() => openGallery(pIdx, iIdx)} className="flex-1 bg-white text-orange-500 hover:bg-orange-50 border border-orange-100 rounded-xl py-3 flex flex-col items-center justify-center transition-all shadow-sm active:scale-95">
                                                                        <i className="fa-solid fa-image text-2xl mb-1"></i>
                                                                        <span className="text-[11px] font-bold uppercase">Galería</span>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>

                            {/* COLUMNA DERECHA: Resumen y Controles */}
                            <div className="w-full md:w-1/3 flex flex-col gap-6 md:sticky md:top-24">
                                
                                <div className="glass-card p-6 rounded-3xl border border-slate-200 shadow-sm">
                                    <div className="flex justify-between items-start mb-2">
                                        <div className="w-12 h-12 bg-green-50 rounded-full flex items-center justify-center text-[#59B447] mb-3">
                                            <i className="fa-regular fa-address-card text-xl"></i>
                                        </div>
                                        <button onClick={() => setStep(1)} className="bg-white text-slate-600 border border-slate-200 p-2.5 rounded-xl text-sm font-bold hover:bg-slate-50 shadow-sm transition-colors active:scale-95">
                                            <i className="fa-solid fa-pen"></i> Editar
                                        </button>
                                    </div>
                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Titular del Expediente</p>
                                    <p className="font-bold text-slate-800 text-xl leading-tight mb-1">{nombre} {apellido}</p>
                                    <p className="text-sm text-slate-500 font-medium">DNI: <span className="text-slate-700">{dni}</span></p>
                                    <p className="text-sm text-slate-500 font-medium mt-4 pt-4 border-t border-slate-100">
                                        Total Hojas: <span className="font-bold text-slate-700">{pages.length}</span>
                                    </p>
                                </div>

                                <div className="glass-card rounded-3xl p-6 shadow-sm border border-slate-200">
                                    <label className="block text-sm font-bold text-slate-700 mb-4 text-center">Añadir Nueva Hoja</label>
                                    <div className="grid grid-cols-3 gap-3">
                                        <button onClick={() => addPage(1)} className="bg-white border border-slate-200 text-slate-600 hover:text-[#59B447] hover:border-[#59B447] hover:shadow-md font-bold py-4 rounded-2xl flex flex-col items-center justify-center shadow-sm transition-all active:scale-95">
                                            <i className="fa-regular fa-file text-2xl mb-2"></i><span className="text-[11px] uppercase">1 Foto</span>
                                        </button>
                                        <button onClick={() => addPage(2)} className="bg-white border border-slate-200 text-slate-600 hover:text-[#59B447] hover:border-[#59B447] hover:shadow-md font-bold py-4 rounded-2xl flex flex-col items-center justify-center shadow-sm transition-all active:scale-95">
                                            <i className="fa-solid fa-grip-lines text-2xl mb-2"></i><span className="text-[11px] uppercase">2 Fotos</span>
                                        </button>
                                        <button onClick={() => addPage(4)} className="bg-white border border-slate-200 text-slate-600 hover:text-[#59B447] hover:border-[#59B447] hover:shadow-md font-bold py-4 rounded-2xl flex flex-col items-center justify-center shadow-sm transition-all active:scale-95">
                                            <i className="fa-solid fa-border-all text-2xl mb-2"></i><span className="text-[11px] uppercase">4 Fotos</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Botón Generar (Solo Escritorio) */}
                                <div className="hidden md:block">
                                    <button 
                                        onClick={generarYEnviarPDF}
                                        disabled={pages.length === 0 || isGenerating}
                                        className={`w-full font-bold py-5 rounded-2xl shadow-lg flex items-center justify-center gap-3 text-lg transition-all
                                            ${pages.length > 0 && pages.some(p => p.images.some(img => img !== null)) ? 'bg-gradient-to-r from-[#25D366] to-[#128C7E] text-white shadow-green-500/30 hover:scale-[1.02] active:scale-95' : 'bg-slate-200 text-slate-400 cursor-not-allowed border border-slate-300'}`}
                                    >
                                        {isGenerating ? (
                                            <><i className="fa-solid fa-spinner fa-spin text-xl"></i> Procesando...</>
                                        ) : (
                                            <><i className="fa-brands fa-whatsapp text-2xl"></i> Enviar Expediente</>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Botón Generar Flotante (Solo Móvil) */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-200 p-4 pb-6 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] z-40">
                        <button 
                            onClick={generarYEnviarPDF}
                            disabled={pages.length === 0 || isGenerating}
                            className={`w-full font-bold py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 text-lg transition-all
                                ${pages.length > 0 && pages.some(p => p.images.some(img => img !== null)) ? 'bg-gradient-to-r from-[#25D366] to-[#128C7E] text-white shadow-green-500/30 active:scale-95' : 'bg-slate-200 text-slate-400 cursor-not-allowed border border-slate-300'}`}
                        >
                            {isGenerating ? (
                                <><i className="fa-solid fa-spinner fa-spin"></i> Procesando...</>
                            ) : (
                                <><i className="fa-brands fa-whatsapp text-xl"></i> Enviar Expediente</>
                            )}
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<EscanerApp />);
    </script>
</body>
</html>
